<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AWS WebSocket Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .chat-container {
      width: 420px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      background: #5c6bc0;
      color: white;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-header .title { font-size: 15px; font-weight: 600; }

    .status-badge {
      font-size: 12px;
      background: rgba(255,255,255,0.2);
      padding: 4px 10px;
      border-radius: 99px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; }
    .status-dot.connected { background: #69f0ae; }

    .tabs {
      display: flex;
      border-bottom: 1px solid #e0e0e0;
      background: #fafafa;
    }

    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      color: #888;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .tab.active { color: #5c6bc0; border-bottom-color: #5c6bc0; background: white; }

    .panel { display: none; }
    .panel.active { display: flex; flex-direction: column; }

    .messages {
      height: 320px;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #f7f8fc;
    }

    .msg { display: flex; flex-direction: column; gap: 3px; }
    .msg-meta { font-size: 11px; color: #aaa; padding: 0 4px; }

    .msg-bubble {
      background: white;
      border: 1px solid #e8e8e8;
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 14px;
      color: #333;
      max-width: 90%;
      word-break: break-word;
    }

    .msg.own { align-items: flex-end; }
    .msg.own .msg-bubble {
      background: #5c6bc0;
      color: white;
      border-color: #5c6bc0;
    }

    .msg.other { align-items: flex-start; }
    .msg.other .msg-bubble {
      background: white;
      color: #333;
    }

    .msg-system {
      text-align: center;
      font-size: 12px;
      color: #aaa;
      padding: 4px 0;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px 14px;
      border-top: 1px solid #eee;
      background: white;
    }

    .input-area input {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 24px;
      padding: 9px 16px;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }

    .input-area input:focus { border-color: #5c6bc0; }

    .input-area button {
      background: #5c6bc0;
      color: white;
      border: none;
      border-radius: 24px;
      padding: 9px 18px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .input-area button:hover { background: #3f51b5; }
    .input-area button:disabled { background: #ccc; cursor: not-allowed; }

    .connections-panel {
      height: 320px;
      overflow-y: auto;
      padding: 14px;
      background: #f7f8fc;
    }

    .conn-item {
      background: white;
      border: 1px solid #e8e8e8;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 8px;
      font-size: 13px;
      color: #555;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: #69f0ae; flex-shrink: 0; }

    .username-setup {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #f7f8fc;
    }

    .username-setup input {
      border: 1px solid #ddd;
      border-radius: 24px;
      padding: 9px 16px;
      font-size: 14px;
      outline: none;
    }

    .username-setup button {
      background: #5c6bc0;
      color: white;
      border: none;
      border-radius: 24px;
      padding: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <span class="title">AWS WebSocket Chat</span>
    <span class="status-badge">
      <span class="status-dot" id="dot"></span>
      <span id="status-text">Conectando...</span>
    </span>
  </div>

  <!-- Pantalla de nombre de usuario -->
  <div id="setup-screen" class="username-setup">
    <p style="font-size:14px; color:#555;">¿Con qué nombre quieres entrar al chat?</p>
    <input id="username-input" type="text" placeholder="Tu nombre..." maxlength="20"
      onkeydown="if(event.key==='Enter') iniciar()" />
    <button onclick="iniciar()">Entrar al chat</button>
  </div>

  <!-- Chat principal (oculto hasta que se ponga nombre) -->
  <div id="chat-screen" style="display:none; flex-direction:column;">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('chat', this)">💬 Chat</div>
      <div class="tab" onclick="switchTab('info', this)">ℹ️ Conexión</div>
    </div>

    <div class="panel active" id="tab-chat">
      <div class="messages" id="messages">
        <div class="msg-system">Conectando al servidor...</div>
      </div>
      <div class="input-area">
        <input id="msg" type="text" placeholder="Escribe un mensaje..." disabled
          onkeydown="if(event.key==='Enter') enviar()" />
        <button id="send-btn" onclick="enviar()" disabled>Enviar</button>
      </div>
    </div>

    <div class="panel" id="tab-info">
      <div class="connections-panel">
        <div class="conn-item">
          <div class="conn-dot"></div>
          <div>
            <div style="font-weight:500; font-size:13px;" id="info-username">–</div>
            <div id="conn-id" style="font-size:11px; color:#aaa; margin-top:2px;">–</div>
          </div>
        </div>
        <div style="font-size:12px; color:#aaa; padding: 8px 4px;">
          Esta pestaña muestra información de tu conexión actual al WebSocket.
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const WS_URL = "wss://pzlqrfgsg8.execute-api.us-east-1.amazonaws.com/production";
  let username = "";
  let ws;

  function iniciar() {
    const input = document.getElementById("username-input").value.trim();
    if (!input) return;
    username = input;

    document.getElementById("setup-screen").style.display = "none";
    document.getElementById("chat-screen").style.display = "flex";
    document.getElementById("status-text").textContent = "Conectando...";
    document.getElementById("info-username").textContent = username;

    conectar();
  }

  function conectar() {
    ws = new WebSocket(WS_URL);
    const messagesEl = document.getElementById("messages");
    const msgInput = document.getElementById("msg");
    const sendBtn = document.getElementById("send-btn");
    const dot = document.getElementById("dot");
    const statusText = document.getElementById("status-text");
    const connId = document.getElementById("conn-id");

    ws.onopen = () => {
      dot.classList.add("connected");
      statusText.textContent = "Conectado como " + username;
      msgInput.disabled = false;
      sendBtn.disabled = false;
      addSystem("Conectado al servidor");
      connId.textContent = "Sesión activa · " + new Date().toLocaleTimeString();
    };

    ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        const isOwn = data.username === username;
        addMessage(data.username, data.message, data.timestamp, isOwn);
      } catch {
        addSystem(event.data);
      }
    };

    ws.onclose = () => {
      dot.classList.remove("connected");
      statusText.textContent = "Desconectado";
      msgInput.disabled = true;
      sendBtn.disabled = true;
      addSystem("Desconectado del servidor");
    };

    ws.onerror = () => addSystem("Error de conexión");
  }

  function enviar() {
    const texto = document.getElementById("msg").value.trim();
    if (!texto || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ action: "sendMessage", data: texto, username }));
    document.getElementById("msg").value = "";
  }

  function addMessage(user, text, time, own) {
    const messagesEl = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = "msg " + (own ? "own" : "other");
    div.innerHTML = `
      <div class="msg-meta">${escapeHtml(user)} — ${time}</div>
      <div class="msg-bubble">${escapeHtml(text)}</div>
    `;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addSystem(text) {
    const messagesEl = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = "msg-system";
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function escapeHtml(text) {
    return text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function switchTab(name, el) {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    el.classList.add("active");
    document.getElementById("tab-" + name).classList.add("active");
  }
</script>
</body>
</html>
