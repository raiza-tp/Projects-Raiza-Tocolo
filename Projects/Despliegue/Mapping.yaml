AWSTemplateFormatVersion: "2010-09-09"
Description: "Ejercicio 2 - VPC con CIDR por region (Mappings), subredes en AZs dinamicas y IGW opcional"

Parameters:
  AttachIGW:
    Description: "Indica si se adjunta un Internet Gateway (true/false)."
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"

Mappings:
  VpcCidrByRegion:
    us-east-1:
      VpcCidr: "10.0.0.0/20"
    us-west-2:
      VpcCidr: "172.16.0.0/20"

Conditions:
  CreateIGW: !Equals [!Ref AttachIGW, "true"]

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !FindInMap [VpcCidrByRegion, !Ref "AWS::Region", VpcCidr]
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "vpc-mappings-${AWS::Region}"

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select
        - 0
        - !Cidr
          - !FindInMap [VpcCidrByRegion, !Ref "AWS::Region", VpcCidr]
          - 4
          - 8
      Tags:
        - Key: Name
          Value: !Sub "subnet-a-${AWS::Region}"

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select
        - 1
        - !Cidr
          - !FindInMap [VpcCidrByRegion, !Ref "AWS::Region", VpcCidr]
          - 4
          - 8
      Tags:
        - Key: Name
          Value: !Sub "subnet-b-${AWS::Region}"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreateIGW
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "igw-${AWS::Region}"

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateIGW
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateIGW
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "rtb-public-${AWS::Region}"

  DefaultRouteToInternet:
    Type: AWS::EC2::Route
    Condition: CreateIGW
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref InternetGateway

  AssocSubnetA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateIGW
    Properties:
      SubnetId: !Ref SubnetA
      RouteTableId: !Ref PublicRouteTable

  AssocSubnetB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateIGW
    Properties:
      SubnetId: !Ref SubnetB
      RouteTableId: !Ref PublicRouteTable

Outputs:
  VpcId:
    Value: !Ref VPC
    Description: "ID de la VPC creada"

  VpcCidrUsed:
    Value: !FindInMap [VpcCidrByRegion, !Ref "AWS::Region", VpcCidr]
    Description: "CIDR elegido por Mappings segun la region"

  SubnetAId:
    Value: !Ref SubnetA
    Description: "Subnet A (AZ 0 dinamica)"

  SubnetBId:
    Value: !Ref SubnetB
    Description: "Subnet B (AZ 1 dinamica)"

  IGWStatus:
    Value: !If [CreateIGW, "IGW adjuntado", "IGW NO adjuntado"]
    Description: "Resultado segun el parametro AttachIGW"