AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Practica API Gateway + SQS + SNS + Lambda
  Crea automaticamente todos los recursos de la practica.

Parameters:
  EmailNotificacion:
    Type: String
    Description: Correo electronico para recibir notificaciones SNS
    Default: tu-correo@ejemplo.com

Resources:

  # aqui creo la cola SQS donde se guardan los mensajes
  MiColaSQS:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: mi-cola-sqs-2
      VisibilityTimeout: 30
      MessageRetentionPeriod: 345600  # 4 dias en segundos

  # creo el topico SNS y le añado mi correo para recibir notificaciones
  MiTopicoSNS:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: mi-topico-sns
      Subscription:
        - Protocol: email
          Endpoint: !Ref EmailNotificacion

  # no creo el rol aqui porque AWS Academy no lo permite, uso el LabRole que ya existe

  # funcion lambda que envia 20 mensajes a la cola y notifica por SNS
  MiFuncionLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: mi-funcion-lambda-2
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Environment:
        Variables:
          SQS_QUEUE_URL: !Ref MiColaSQS
          SNS_TOPIC_ARN: !Ref MiTopicoSNS
      Code:
        ZipFile: |
          import json
          import boto3
          import os

          sns_client = boto3.client('sns')
          sqs_client = boto3.client('sqs')

          SQS_QUEUE_URL = os.environ['SQS_QUEUE_URL']
          SNS_TOPIC_ARN = os.environ['SNS_TOPIC_ARN']

          def lambda_handler(event, context):
              for i in range(20):
                  mensaje = f'Mensaje de prueba {i+1}'

                  sqs_client.send_message(
                      QueueUrl=SQS_QUEUE_URL,
                      MessageBody=mensaje
                  )

                  sns_client.publish(
                      TopicArn=SNS_TOPIC_ARN,
                      Message=f'Nuevo mensaje en la cola SQS: {mensaje}',
                      Subject='Notificacion de cola SQS'
                  )

              return {
                  'statusCode': 200,
                  'body': json.dumps('20 mensajes procesados correctamente')
              }

  # permiso para que api gateway pueda invocar la funcion lambda
  LambdaApiGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt MiFuncionLambda.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${MiApiGateway}/*/POST/procesar

  # creo el api gateway con el recurso /procesar y el metodo POST
  MiApiGateway:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: mi-api-gateway-2
      Description: API REST para la practica SQS + SNS + Lambda

  RecursoProcesar:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MiApiGateway
      ParentId: !GetAtt MiApiGateway.RootResourceId
      PathPart: procesar

  MetodoPOST:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MiApiGateway
      ResourceId: !Ref RecursoProcesar
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub >-
          arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MiFuncionLambda.Arn}/invocations

  DespliegueAPI:
    Type: AWS::ApiGateway::Deployment
    DependsOn: MetodoPOST
    Properties:
      RestApiId: !Ref MiApiGateway
      StageName: prod

# outputs para ver la url del endpoint y los arns al terminar el despliegue
Outputs:

  URLApiGateway:
    Description: URL del endpoint para hacer curl
    Value: !Sub https://${MiApiGateway}.execute-api.${AWS::Region}.amazonaws.com/prod/procesar

  URLColaSQS:
    Description: URL de la cola SQS
    Value: !Ref MiColaSQS

  ARNTopicoSNS:
    Description: ARN del topico SNS
    Value: !Ref MiTopicoSNS

  ARNLambda:
    Description: ARN de la funcion Lambda
    Value: !GetAtt MiFuncionLambda.Arn
    