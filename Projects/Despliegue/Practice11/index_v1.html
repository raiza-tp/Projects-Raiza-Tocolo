<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>AWS WebSocket Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .wrapper {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    .chat-container {
      width: 440px; height: 620px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.18);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .chat-header {
      background: #232f3e; color: #fff;
      padding: 14px 18px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .chat-header strong { font-size: 16px; }
    .status-area { display: flex; align-items: center; gap: 6px; }
    .status-dot {
      width: 10px; height: 10px;
      border-radius: 50%; background: #888;
    }
    .status-dot.connected { background: #4caf50; }
    #status-text { font-size: 12px; color: #ccc; }
    .messages {
      flex: 1; overflow-y: auto;
      padding: 14px;
      display: flex; flex-direction: column; gap: 8px;
      background: #f9f9f9;
    }
    .message {
      max-width: 88%; padding: 8px 12px;
      border-radius: 10px; background: #e3f2fd;
      align-self: flex-start; word-break: break-word;
    }
    .message .meta { font-size: 11px; color: #555; margin-bottom: 3px; }
    .message .text { font-size: 14px; }
    .message.system {
      background: #fff8e1; align-self: center;
      font-size: 12px; color: #795548;
      font-style: italic; padding: 4px 10px;
    }
    .message.history { background: #f3e5f5; }
    .chat-input {
      display: flex; padding: 12px; gap: 8px;
      border-top: 1px solid #e0e0e0; background: #fff;
    }
    .chat-input input {
      flex: 1; padding: 10px 14px;
      border: 1px solid #ccc; border-radius: 8px; font-size: 14px;
    }
    .chat-input input:focus { outline: none; border-color: #ff9900; }
    .chat-input button {
      padding: 10px 18px; background: #ff9900; color: #fff;
      border: none; border-radius: 8px;
      cursor: pointer; font-size: 14px; font-weight: bold;
    }
    .chat-input button:disabled { background: #ccc; cursor: not-allowed; }
    .chat-input button:hover:not(:disabled) { background: #e68a00; }
    .users-panel {
      width: 160px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.18);
      overflow: hidden;
    }
    .users-header {
      background: #232f3e; color: #fff;
      padding: 14px 12px;
      font-size: 14px; font-weight: bold;
    }
    .users-list {
      padding: 10px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .user-item {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: #333;
    }
    .user-dot {
      width: 8px; height: 8px;
      border-radius: 50%; background: #4caf50;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<div class="wrapper">
  <div class="chat-container">
    <div class="chat-header">
      <strong>AWS WebSocket Chat</strong>
      <div class="status-area">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Conectando...</span>
      </div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="chat-input">
      <input id="msg-input" placeholder="Escribe un mensaje..." autocomplete="off" />
      <button id="send-btn" disabled>Enviar</button>
    </div>
  </div>

  <div class="users-panel">
    <div class="users-header">Conectados</div>
    <div class="users-list" id="users-list"></div>
  </div>
</div>

<script>
  const WS_URL = "wss://pzlqrfgsg8.execute-api.us-east-1.amazonaws.com/production";

  const messagesEl = document.getElementById("messages");
  const inputEl    = document.getElementById("msg-input");
  const sendBtn    = document.getElementById("send-btn");
  const statusDot  = document.getElementById("status-dot");
  const statusText = document.getElementById("status-text");
  const usersEl    = document.getElementById("users-list");

  const username = prompt("Tu nombre de usuario:", "Alumno") || "Alumno";

  const ws = new WebSocket(`${WS_URL}?user=${encodeURIComponent(username)}`);

  ws.onopen = () => {
    statusDot.classList.add("connected");
    statusText.textContent = `Conectado como ${username}`;
    sendBtn.disabled = false;
    logSystem("Conectado al servidor");

    // Pedir historial y usuarios al conectarse
    ws.send(JSON.stringify({ action: "getHistory" }));
  };

  ws.onmessage = evt => {
    let data;
    try   { data = JSON.parse(evt.data); }
    catch { logSystem(evt.data); return; }

    if (data.type === "message") {
      addMessage(data.user, data.text, data.createdAt, false);
    }

    if (data.type === "history") {
      logSystem("Ultimos mensajes:");
      data.messages.forEach(m => addMessage(m.user, m.text, m.createdAt, true));
    }

    if (data.type === "users") {
      updateUsers(data.users);
    }
  };

  ws.onclose = () => {
    statusDot.classList.remove("connected");
    statusText.textContent = "Desconectado";
    sendBtn.disabled = true;
    logSystem("Conexion cerrada");
  };

  ws.onerror = () => logSystem("Error en la conexion WebSocket");

  function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ action: "sendMessage", data: text }));
    inputEl.value = "";
  }

  function addMessage(user, text, createdAt, isHistory) {
    const div = document.createElement("div");
    div.className = "message" + (isHistory ? " history" : "");
    const time = new Date(createdAt).toLocaleTimeString();
    div.innerHTML = `
      <div class="meta">${user} - ${time}</div>
      <div class="text">${text}</div>
    `;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function logSystem(text) {
    const div = document.createElement("div");
    div.className = "message system";
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function updateUsers(users) {
    usersEl.innerHTML = "";
    users.forEach(u => {
      const div = document.createElement("div");
      div.className = "user-item";
      div.innerHTML = `<span class="user-dot"></span>${u}`;
      usersEl.appendChild(div);
    });
  }

  sendBtn.onclick = sendMessage;
  inputEl.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });
</script>

</body>
</html>
